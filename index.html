<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Feedback Form</h1>
    <form id="feedbackForm" class="feedback-form">
      <label for="q1">Name:</label>
      <input type="text" id="q1" name="q1" required>

      <label for="q2">Department:</label>
      <input type="text" id="q2" name="q2" required>

      <label for="q3">Session Title:</label>
      <input type="text" id="q3" name="q3" required>

      <label for="q4">Feedback:</label>
      <input type="text" id="q4" name="q4" required>

      <label for="q5">Suggestions:</label>
      <input type="text" id="q5" name="q5">

      <button type="submit">Submit</button>
    </form>
  </main>
  <script src="script.js"></script>
</body>
</html>
